<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Out;src:url(Outfit-Bold.ttf);font-weight:700}
@font-face{font-family:Out;src:url(Outfit-Regular.ttf);font-weight:400}
@font-face{font-family:Mono;src:url(GeistMono-Regular.ttf)}
:root{--navy:#000085;--yel:#FFDE00;--bg:#FFFFFF;--grey:#55578F;--line:rgba(0,0,133,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
.poster{position:relative;width:1080px;height:1350px;background:var(--bg);color:var(--navy);font-family:Out;overflow:hidden}

.block{position:absolute;left:500px;top:470px;width:580px;height:880px;background:var(--yel);overflow:hidden}
.photo{position:absolute;left:-70px;bottom:0;width:800px;height:800px;object-fit:cover;object-position:top}

.kick{position:absolute;left:72px;top:78px;font-family:Mono;font-size:18px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
h1{position:absolute;left:72px;top:126px;font-weight:700;font-size:100px;line-height:1;letter-spacing:-.035em}
h1 .hl{position:relative;display:inline-block}
h1 .hl::after{content:"";position:absolute;left:-4px;right:-6px;bottom:6px;height:30px;background:var(--yel);z-index:-1}
h1 .hl{z-index:1}
.facts{position:absolute;left:72px;top:368px;font-family:Mono;font-size:20px;letter-spacing:.06em;color:var(--grey)}
.facts b{color:var(--navy);font-weight:400}

.who{position:absolute;left:72px;top:470px}
.who .k{font-family:Mono;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
.who .n{font-weight:700;font-size:40px;letter-spacing:-.015em}
.who .r{font-weight:400;font-size:21px;color:var(--grey);margin-top:4px}

.price{position:absolute;left:72px;top:960px;padding-top:28px;border-top:1px solid var(--line);width:360px}
.price b{font-weight:700;font-size:84px;letter-spacing:-.035em;line-height:1}
.price b small{font-size:36px;letter-spacing:0;margin-left:6px}
.price .loc{font-size:22px;color:var(--grey);margin-top:8px}

.wa{position:absolute;left:72px;bottom:72px;display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:100px;padding:12px 28px 12px 12px}
.wa svg{width:52px;height:52px;flex:none}
.wa .t1{font-family:Mono;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#C9CCF2}
.wa .t2{font-weight:700;font-size:32px;line-height:1.05}
</style></head><body>
<div class="poster">
  <div class="block"><img class="photo" src="anis_cut.png" alt=""></div>

  <div class="kick">Formation en gestion</div>
  <h1>Gérez votre projet<br><span class="hl">comme un pro.</span></h1>
  <div class="facts"><b>50 h</b> de pratique&nbsp;&nbsp;·&nbsp;&nbsp;<b>9</b> modules&nbsp;&nbsp;·&nbsp;&nbsp;<b>15</b> places</div>

  <div class="who"><div class="k">Animée par</div><div class="n">Anis BHAR</div><div class="r">Formateur &amp; consultant</div></div>

  <div class="price"><b>500<small>DT</small></b><div class="loc">Tunis ou en ligne</div></div>

  <div class="wa">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#FFDE00"/>
      <path d="M32 14c-9.9 0-18 7.6-18 17 0 3.3 1 6.4 2.8 9L15 50l10.3-2.7c2 .8 4.3 1.3 6.7 1.3 9.9 0 18-7.6 18-17s-8.1-17.6-18-17.6z" fill="none" stroke="#000085" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M25.3 23.5c.5-.5 1.3-.5 1.8 0l2.2 2.6c.4.5.4 1.2 0 1.7l-1.2 1.4c1 2.2 2.8 4 5 5.1l1.4-1.2c.5-.4 1.2-.4 1.7 0l2.6 2.2c.5.5.5 1.3 0 1.8l-1.5 1.6c-.9.9-2.3 1.2-3.5.7-4.6-1.9-8.2-5.6-10-10.2-.5-1.2-.2-2.5.7-3.4z" fill="#000085"/></svg>
    <div><div class="t1">WhatsApp</div><div class="t2">20 698 016</div></div>
  </div>
</div>
</body></html>
