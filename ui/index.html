<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f4f6fb; margin:0; padding:2rem; }
      .card { max-width: 420px; margin: 0 auto; background:white; padding:1.5rem; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.1); }
      h1 { margin-top:0; font-size:1.4rem; }
      .row { display:grid; grid-template-columns:1fr auto 1fr; gap:.6rem; margin-bottom:1rem; }
      input, select, button { padding:.6rem; font-size:1rem; border:1px solid #cfd5e3; border-radius:8px; }
      button { width:100%; background:#2251ff; color:#fff; border:none; cursor:pointer; }
      button:hover { background:#1a44d9; }
      .result { margin-top:1rem; font-weight:700; }
      .error { color:#c92828; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Calculatrice</h1>
      <div class="row">
        <input id="a" type="number" step="any" placeholder="Nombre 1" />
        <select id="op" aria-label="Opérateur">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
        <input id="b" type="number" step="any" placeholder="Nombre 2" />
      </div>
      <button id="calc">Calculer</button>
      <p id="result" class="result"></p>
    </main>

    <script>
      function calculer(a, operateur, b) {
        if (operateur === '+') return a + b;
        if (operateur === '-') return a - b;
        if (operateur === '*') return a * b;
        if (operateur === '/') {
          if (b === 0) throw new Error('Division par zéro impossible.');
          return a / b;
        }
        throw new Error(`Opérateur non supporté: ${operateur}`);
      }

      document.getElementById('calc').addEventListener('click', () => {
        const resultEl = document.getElementById('result');
        resultEl.classList.remove('error');
        const a = Number(document.getElementById('a').value);
        const b = Number(document.getElementById('b').value);
        const op = document.getElementById('op').value;

        if (Number.isNaN(a) || Number.isNaN(b)) {
          resultEl.textContent = 'Veuillez saisir deux nombres valides.';
          resultEl.classList.add('error');
          return;
        }

        try {
          const valeur = calculer(a, op, b);
          resultEl.textContent = `Résultat : ${valeur}`;
        } catch (error) {
          resultEl.textContent = error.message;
          resultEl.classList.add('error');
        }
      });
    </script>
  </body>
</html>
